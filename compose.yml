services:
  apsthira:
    build: .
    container_name: apsthira
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Overrides DB_PATH from .env so the SQLite file lands on the volume
      - DB_PATH=/data/resumes.db
    volumes:
      - ./data:/data
    networks:
      - infra
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Shared network of the infra stack (reverse proxy etc.) on the VPS.
  # Not strictly required — the app also binds to 127.0.0.1:8080 on the host.
  # If the network doesn't exist (e.g. running locally), either create it with
  # `docker network create infra` or remove `infra` from the lists above.
  infra:
    external: true
