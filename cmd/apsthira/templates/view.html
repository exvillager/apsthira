<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Slug}} - Resume | Apsthira</title>
    <style>
        body {
            background-color: #008080;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .window {
            background: #c0c0c0;
            border: 1px solid #000000;
            box-shadow: inset 1.5px 1.5px 0px 0px #ffffff, inset -1.5px -1.5px 0px 0px #808080, 1px 1px 0px 0px #000000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            padding: 3px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            margin: 2px 2px 0 2px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid #000000;
            box-shadow: inset 1px 1px 0px 0px #ffffff, inset -1px -1px 0px 0px #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            user-select: none;
        }

        .menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            font-size: 12px;
            border-bottom: 1px solid #808080;
            background: #c0c0c0;
        }

        .menu-items {
            display: flex;
            gap: 12px;
        }

        .menu-items span {
            color: #000000;
            cursor: default;
        }

        .menu-items span::first-letter {
            text-decoration: underline;
        }

        .metadata-items {
            font-size: 11px;
            color: #555555;
            display: flex;
            gap: 16px;
        }

        .metadata-items span {
            border-left: 1px solid #808080;
            border-right: 1px solid #ffffff;
            padding: 0 8px;
        }

        .viewer-container {
            flex-grow: 1;
            background: #808080;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-border {
            width: 100%;
            height: 100%;
            border: 1px solid #000000;
            box-shadow: inset 1.5px 1.5px 0px 0px #ffffff, inset -1.5px -1.5px 0px 0px #808080;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">{{.Slug}}.pdf - Acrobat Reader</div>
            <div class="title-bar-controls">
                <div class="title-bar-button">_</div>
                <div class="title-bar-button">□</div>
                <div class="title-bar-button">X</div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-items">
                <span>File</span>
                <span>Document</span>
                <span>View</span>
                <span>Window</span>
                <span>Help</span>
            </div>
            
            <div class="metadata-items">
                <span>Source: {{.OriginalFilename}}</span>
                <span>Updated: {{.UpdatedAt.Format "Jan 02, 2006 at 03:04 PM"}}</span>
            </div>
        </div>

        <div class="viewer-container">
            <div class="iframe-border">
                <!-- Securely loads the PDF from the raw streaming endpoint -->
                <iframe src="/r/{{.Slug}}/raw" id="pdf-viewer"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
