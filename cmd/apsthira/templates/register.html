<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Apsthira</title>
    <style>
        body {
            background-color: #008080;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
            color: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window {
            background: #c0c0c0;
            width: 320px;
            max-width: 95%;
            border: 1px solid #000000;
            box-shadow: inset 1.5px 1.5px 0px 0px #ffffff, inset -1.5px -1.5px 0px 0px #808080, 1px 1px 0px 0px #000000;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            padding: 3px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            margin: 2px 2px 0 2px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid #000000;
            box-shadow: inset 1px 1px 0px 0px #ffffff, inset -1px -1px 0px 0px #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            user-select: none;
        }

        .title-bar-button:active {
            box-shadow: inset 1px 1px 0px 0px #808080, inset -1px -1px 0px 0px #ffffff;
        }

        .window-body {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: 1px solid #808080;
            box-shadow: inset 1px 1px 0px 0px #000000, inset -1px -1px 0px 0px #ffffff;
            padding: 4px 6px;
            outline: none;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: 1px dotted #000000;
        }

        .btn-submit {
            background: #c0c0c0;
            color: #000000;
            border: 1px solid #000000;
            box-shadow: inset 1px 1px 0px 0px #ffffff, inset -1px -1px 0px 0px #808080;
            padding: 4px 16px;
            font-size: 12px;
            font-family: Tahoma, Arial, sans-serif;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            outline: none;
        }

        .btn-submit:active {
            box-shadow: inset 1px 1px 0px 0px #808080, inset -1px -1px 0px 0px #ffffff;
        }
        
        .btn-submit:focus {
            outline: 1px dotted #000000;
            outline-offset: -4px;
        }

        .alert {
            background: #ffffff;
            border: 1px solid #000000;
            box-shadow: inset 1px 1px 0px 0px #808080, inset -1px -1px 0px 0px #ffffff;
            color: #ff0000;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert::before {
            content: '⚠️';
            font-size: 14px;
        }

        .footer-text {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
        }

        .footer-text a {
            color: #0000ee;
            text-decoration: underline;
        }

        footer {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            color: #808080;
            text-shadow: 1px 1px 0px #ffffff;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Create Network Account</div>
            <div class="title-bar-controls">
                <div class="title-bar-button">?</div>
                <div class="title-bar-button">X</div>
            </div>
        </div>
        <div class="window-body">
            {{if .Error}}
            <div class="alert">
                {{.Error}}
            </div>
            {{end}}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required minlength="3" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit">OK</button>
            </form>
            
            <p class="footer-text">
                Already have an account? <a href="/login">Login here</a>
            </p>
            
            <footer>
                Apsthira Registration Service
            </footer>
        </div>
    </div>
</body>
</html>
