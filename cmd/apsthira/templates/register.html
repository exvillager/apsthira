<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Apsthira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121214;
            --card-bg: #1c1c20;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --border: #f4f4f5;
            --accent: #fbbf24;
            --shadow: 4px 4px 0px #000000;
            --shadow-hover: 6px 6px 0px #000000;
        }

        html.light-mode {
            --bg: #faf8f5;
            --card-bg: #ffffff;
            --text: #1c1917;
            --muted: #78716c;
            --border: #1c1917;
            --accent: #d97706;
            --shadow: 4px 4px 0px #1c1917;
            --shadow-hover: 6px 6px 0px #1c1917;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .auth-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            padding: 32px;
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--bg);
            color: var(--text);
            border: 1.5px solid var(--border);
            padding: 2px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            cursor: pointer;
        }

        .auth-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .logo-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .alert {
            background: rgba(220, 38, 38, 0.15);
            border: 1.5px solid #ef4444;
            color: #fca5a5;
            padding: 10px 12px;
            font-size: 12px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 2px 2px 0px var(--accent);
        }

        .btn-submit {
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--bg);
            background: var(--text);
            border: 2px solid var(--border);
            padding: 12px;
            cursor: pointer;
            box-shadow: var(--shadow);
            margin-top: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-submit:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-hover);
            background: var(--accent);
            color: #000000;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--text);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
    <script>
        const savedTheme = localStorage.getItem('apsthira_theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>
</head>
<body>
    <div class="auth-card">
        <button type="button" class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>

        <div class="auth-header">
            <h1 class="logo-title">📄 APSTHIRA</h1>
            <div class="auth-subtitle">CREATE ACCOUNT</div>
        </div>

        {{if .Error}}
        <div class="alert">
            ⚠️ {{.Error}}
        </div>
        {{end}}

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="choose username" required minlength="3" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">REGISTER ACCOUNT →</button>
        </form>

        <div class="auth-footer">
            <p>Already registered? <a href="/login">Login here</a></p>
            <p style="margin-top: 8px;"><a href="/">← Return to Home</a></p>
        </div>
    </div>

    <script>
        function updateThemeBtn() {
            const btn = document.getElementById('theme-btn');
            const isLight = document.documentElement.classList.contains('light-mode');
            btn.innerText = isLight ? '☀️ Light' : '🌙 Dark';
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('light-mode');
            const isLight = document.documentElement.classList.contains('light-mode');
            localStorage.setItem('apsthira_theme', isLight ? 'light' : 'dark');
            updateThemeBtn();
        }
        updateThemeBtn();
    </script>
</body>
</html>
