name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and deploy via Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            if [ -d "/srv/apps/apsthira" ]; then
              cd /srv/apps/apsthira
            elif [ -d "/srv/apsthira" ]; then
              cd /srv/apsthira
            fi
            git pull origin main
            docker compose down || true
            docker compose up -d --build
            docker compose ps
